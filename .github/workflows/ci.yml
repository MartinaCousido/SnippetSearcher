# Compila y testea el servicio en cada PR hacia dev o main.
# Si la compilación o algún test falla, el check del PR queda en rojo.
name: CI

on:
  pull_request:
    branches: [dev, main]

# Si llega un push nuevo al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  compilar-y-testear:
    runs-on: ubuntu-latest
    # Los tests levantan el servicio completo, así que necesitan una base.
    # Es una base descartable, solo para el CI: la contraseña no es un secreto.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: snippets
          POSTGRES_USER: snippets
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snippets -d snippets"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/snippets
      DB_USER: snippets
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cachea las dependencias de Gradle entre corridas.
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar y testear
        run: ./gradlew build --no-daemon
