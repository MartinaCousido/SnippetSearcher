plugins {
	id 'java'
	// Linter y cobertura (#88). Ver "Linter y cobertura" en Decisiones técnicas.
	id 'checkstyle'
	id 'pmd'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.snippetsearcher'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// Agente Java de New Relic (#81): Gradle lo baja, pero no entra al classpath;
// el Dockerfile lo engancha con -javaagent. Igual que el Asset Service de la
// cátedra. Ver Observabilidad (New Relic) en Decisiones técnicas.
ext {
	set('newRelicVersion', '9.5.0')
}

configurations {
	newrelic {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}

dependencies {
	newrelic "com.newrelic.agent.java:newrelic-agent:${newRelicVersion}"
	// La API del agente, para mandar eventos propios (la saturación de Redis).
	// Sin el agente, sus llamadas no hacen nada.
	implementation "com.newrelic.agent.java:newrelic-api:${newRelicVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Redis Streams: lint y formateo en segundo plano (#23).
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// Valida los tokens de Auth0 (resource server). Ver Auth0 en Decisiones técnicas.
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// El servicio no arranca sin la configuración de Auth0. Los tests no llaman a
	// Auth0: arman el usuario con jwt() de spring-security-test.
	environment 'AUTH0_DOMAIN', 'test.invalid'
	environment 'AUTH0_AUDIENCE', 'https://snippetsearcher-api'
	environment 'AUTH0_USERS_CLIENT_ID', 'test'
	environment 'AUTH0_USERS_CLIENT_SECRET', 'test'
	// Los tests no procesan la cola en segundo plano, salvo los que lo prenden
	// (analysis/): así no cambian el estado de un snippet mientras se prueba.
	environment 'ANALYSIS_CONSUMER_ENABLED', 'false'
	// Cada clase de test con mocks distintos levanta su propio contexto, y cada
	// contexto abre conexiones a Postgres: con 10 por contexto (lo que trae
	// Spring) se pasa del máximo de Postgres (100).
	environment 'SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE', '2'
	// Otra base de Redis que la del servicio levantado en local (la 0), igual
	// que snippets_test en Postgres: si no, su consumidor se lleva los mensajes
	// de los tests.
	environment 'SPRING_DATA_REDIS_DATABASE', '1'
}

// Deja el agente (build/newrelic/newrelic.jar) junto a su configuración
// (newrelic.yml, que el agente lee de su misma carpeta).
tasks.register('copyNewRelic', Sync) {
	from(configurations.newrelic) {
		rename { 'newrelic.jar' }
	}
	from('newrelic') {
		include 'newrelic.yml'
	}
	into layout.buildDirectory.dir('newrelic')
}

// Solo se genera el jar ejecutable de Spring Boot (bootJar), no el jar "plain":
// el Dockerfile copia el único jar que queda en build/libs.
tasks.named('jar') {
	enabled = false
}

// Linter: Checkstyle (convenciones) y PMD (errores probables), con la
// configuración de la librería PrintScript adaptada a este servicio. Versiones
// fijas: el mismo código tiene que dar el mismo resultado en cualquier máquina.
// Cualquier violación hace fallar ./gradlew build, y con él el CI.
checkstyle {
	toolVersion = '10.21.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	ignoreFailures = false
	maxWarnings = 0
}

pmd {
	toolVersion = '7.26.0'
	ruleSetFiles = files('config/pmd/ruleset.xml')
	// Sin esto, el plugin suma su ruleset por defecto al nuestro.
	ruleSets = []
	ignoreFailures = false
	consoleOutput = true
}

tasks.named('pmdTest') {
	ruleSetFiles = files('config/pmd/ruleset-test.xml')
}

// Cobertura: JaCoCo, con un mínimo de 80 % de líneas. Solo queda afuera la
// clase que arranca Spring, que no tiene lógica.
jacoco {
	toolVersion = '0.8.14'
}

def fueraDeCobertura = ['**/SnippetServiceApplication.class']

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude fueraDeCobertura } }))
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('jacocoTestReport')
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
	}
	classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude fueraDeCobertura } }))
}

tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
