# Levanta solo Snippet Service y su base de datos.
# Para levantar el sistema completo, ver docker-compose.sistema.yml.
# Uso: cp .env.example .env && docker compose up --build
#
# El nombre de proyecto es el mismo en todos los compose del sistema: así los
# contenedores y los datos son los mismos se levante un servicio solo o todo.
name: snippet-searcher

services:
  snippet-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://snippets-db:5432/${SNIPPETS_DB_NAME:?Falta SNIPPETS_DB_NAME, copiá .env.example a .env}
      DB_USER: ${SNIPPETS_DB_USER:?Falta SNIPPETS_DB_USER, copiá .env.example a .env}
      DB_PASSWORD: ${SNIPPETS_DB_PASSWORD:?Falta SNIPPETS_DB_PASSWORD, copiá .env.example a .env}
      ASSET_SERVICE_URL: http://asset-service:8080
      # Solo existen si se levanta el sistema completo (docker-compose.sistema.yml).
      PERMISSION_SERVICE_URL: http://permission-service:8080
      PRINTSCRIPT_SERVICE_URL: http://printscript-service:8080
      # La UI con npm run dev. Ver CORS en el README.
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      snippets-db:
        condition: service_healthy
      asset-service:
        condition: service_healthy

  snippets-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${SNIPPETS_DB_NAME}
      POSTGRES_USER: ${SNIPPETS_DB_USER}
      POSTGRES_PASSWORD: ${SNIPPETS_DB_PASSWORD}
    ports:
      # Solo accesible desde esta máquina.
      - "127.0.0.1:5433:5432"
    volumes:
      - snippets-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Snippet Storage: guarda el código de los snippets como archivos.
  # Lo provee la cátedra (github.com/austral-ingsis/asset-service). La imagen es pública.
  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:main.14
    environment:
      AZURE_HOST: http://azurite
      # La imagen trae el agente de New Relic (monitoreo); no se usa.
      NEW_RELIC_AGENT_ENABLED: "false"
      NEW_RELIC_APP_NAME: asset-service
    ports:
      # Solo accesible desde esta máquina. Swagger en http://localhost:8082/swagger-ui
      - "127.0.0.1:8082:8080"
    depends_on:
      - azurite
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # El bucket: emula Azure Blob Storage. Solo lo usa el Asset Service.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    volumes:
      - azurite-data:/data

volumes:
  snippets-data:
  azurite-data:
