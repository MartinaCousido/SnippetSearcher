spring.application.name=snippet-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
# La base se usa solo dentro de los servicios, no al armar la respuesta.
spring.jpa.open-in-view=false
management.endpoint.health.show-details=always
# Snippet Storage: el Asset Service de la cátedra. En local corre en el puerto 8082.
asset-service.url=${ASSET_SERVICE_URL:http://localhost:8082}
asset-service.container=snippets
# El health del Asset Service está en su puerto de administración (9090).
asset-service.health-url=${ASSET_SERVICE_HEALTH_URL:http://localhost:9090/actuator/health}
# Servicios a los que llama. En el stack, cada URL la pone docker-stack.yml.
printscript-service.url=${PRINTSCRIPT_SERVICE_URL:http://localhost:8083}
permission-service.url=${PERMISSION_SERVICE_URL:http://localhost:8081}
# CORS: origins que aceptan, separados por comas. Sin la variable, ninguno.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Auth0: se aceptan solo tokens de este tenant (iss) y para esta API (aud).
# Sin las variables, el servicio no arranca. Spring también revisa la firma y
# que el token no esté vencido.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}
# Módulo User: la app de Auth0 con la que se leen usuarios (read:users), por la
# Management API. Sin las variables, el servicio no arranca.
auth0.domain=${AUTH0_DOMAIN}
auth0.users.client-id=${AUTH0_USERS_CLIENT_ID}
auth0.users.client-secret=${AUTH0_USERS_CLIENT_SECRET}
# Lenguajes soportados. La clave (printscript) es también el nombre del bean de
# Language que lo implementa.
languages.printscript.extension=ps
languages.printscript.versions=1.0,1.1
languages.printscript.default-version=1.1
# Las reglas de lint y formateo de cada usuario son las de este lenguaje: por
# ahora el único (ver "Reglas: catálogo, valores por defecto y validación").
rules.language=printscript
# Lint y formateo en segundo plano (Redis Streams, #23). Un mensaje se intenta
# max-attempts veces; uno sin confirmar se vuelve a tomar después de
# retry-after. retry-interval: cada cuánto se revisan los pendientes.
analysis.consumer.enabled=${ANALYSIS_CONSUMER_ENABLED:true}
analysis.max-attempts=3
analysis.retry-after=30s
analysis.retry-interval=10000
# Re-validar con cada versión nueva del parser (#93): un minuto después de
# arrancar (que los otros servicios estén arriba) y cada 10 minutos.
analysis.parser-check-initial-delay=60000
analysis.parser-check-interval=600000
