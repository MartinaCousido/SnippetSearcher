spring.application.name=snippet-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
management.endpoint.health.show-details=always
# Snippet Storage: el Asset Service de la cátedra. En local corre en el puerto 8082.
asset-service.url=${ASSET_SERVICE_URL:http://localhost:8082}
asset-service.container=snippets
