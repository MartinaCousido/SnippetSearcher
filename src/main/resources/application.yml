spring:
  application:
    name: snippet-service
  # La conexión se configura solo por variables de entorno (ver .env.example).
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    # El esquema lo van a manejar las migraciones (herramienta pendiente), nunca Hibernate.
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${PORT:8080}

# /actuator/health informa si el servicio está arriba y si llega a su base de datos.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
